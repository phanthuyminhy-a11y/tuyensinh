<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="troi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1C669"/>
      <stop offset="35%" stop-color="#D8A73D"/>
      <stop offset="62%" stop-color="#4B7A5E"/>
      <stop offset="100%" stop-color="#0F3D3E"/>
    </linearGradient>
    <linearGradient id="nuoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E7768"/>
      <stop offset="100%" stop-color="#0B2E2F"/>
    </linearGradient>
    <radialGradient id="mattroi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="55%" stop-color="#F6D584"/>
      <stop offset="100%" stop-color="#F6D584" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bầu trời -->
  <rect x="0" y="0" width="1600" height="560" fill="url(#troi)"/>

  <!-- Ánh mặt trời toả sáng -->
  <circle cx="1180" cy="430" r="230" fill="url(#mattroi)"/>
  <circle cx="1180" cy="430" r="80" fill="#FFF6DE"/>

  <!-- Chim bay -->
  <g stroke="#0F3D3E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M120,150 q18,-18 36,0 q18,-18 36,0"/>
    <path d="M220,110 q14,-14 28,0 q14,-14 28,0"/>
    <path d="M760,90 q16,-16 32,0 q16,-16 32,0"/>
  </g>

  <!-- Rừng đước xa (hàng cây phía sau) -->
  <g fill="#2F6B4F" opacity="0.55">
    <ellipse cx="80" cy="470" rx="90" ry="46"/>
    <ellipse cx="200" cy="480" rx="110" ry="50"/>
    <ellipse cx="360" cy="468" rx="100" ry="46"/>
    <ellipse cx="520" cy="478" rx="120" ry="52"/>
    <ellipse cx="700" cy="470" rx="100" ry="46"/>
    <ellipse cx="900" cy="482" rx="130" ry="52"/>
    <ellipse cx="1080" cy="472" rx="100" ry="46"/>
    <ellipse cx="1300" cy="480" rx="140" ry="52"/>
    <ellipse cx="1500" cy="470" rx="110" ry="48"/>
  </g>

  <!-- Rừng đước gần (hàng cây trước, đậm hơn + rễ) -->
  <g fill="#1F4E3B">
    <ellipse cx="0" cy="520" rx="140" ry="60"/>
    <ellipse cx="150" cy="530" rx="150" ry="64"/>
    <ellipse cx="340" cy="518" rx="140" ry="60"/>
    <ellipse cx="1420" cy="528" rx="170" ry="66"/>
    <ellipse cx="1600" cy="518" rx="140" ry="60"/>
  </g>
  <g stroke="#16221E" stroke-width="4" opacity="0.4">
    <path d="M60,560 q10,20 -10,40 M110,560 q-8,22 6,42 M300,555 q10,20 -6,38"/>
    <path d="M1460,558 q10,20 -8,40 M1520,558 q-8,20 8,40"/>
  </g>

  <!-- Sông nước với phản chiếu ánh nắng -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#nuoc)"/>
  <g stroke="#F6D584" stroke-width="3" opacity="0.35" fill="none">
    <path d="M1000,600 h360"/>
    <path d="M1030,630 h300"/>
    <path d="M980,662 h340"/>
    <path d="M1020,696 h280"/>
    <path d="M960,732 h360"/>
  </g>
  <g stroke="#8FBFA8" stroke-width="2" opacity="0.25" fill="none">
    <path d="M60,610 q60,14 120,0 t120,0 t120,0 t120,0"/>
    <path d="M40,680 q70,16 140,0 t140,0 t140,0"/>
    <path d="M700,760 q80,16 160,0 t160,0 t160,0"/>
  </g>

  <!-- Xuồng ba lá + người chèo -->
  <g transform="translate(430,600)">
    <path d="M-140,40 Q0,80 140,40 L120,58 Q0,92 -120,58 Z" fill="#5B3A29"/>
    <path d="M-140,40 Q0,20 140,40" fill="none" stroke="#3E2A1D" stroke-width="6"/>
    <!-- người chèo xuồng -->
    <g transform="translate(-10,-46)">
      <rect x="-8" y="0" width="16" height="34" rx="8" fill="#B54834"/>
      <circle cx="0" cy="-10" r="12" fill="#E8C9A0"/>
      <path d="M-4,-20 q4,-10 12,-6" fill="#16221E"/>
      <path d="M6,10 q30,-4 46,-34" stroke="#3E2A1D" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Gợn sóng nhẹ dưới xuồng -->
  <g stroke="#B7DCC7" stroke-width="2.5" opacity="0.3" fill="none">
    <path d="M280,660 q40,10 80,0 t80,0"/>
    <path d="M300,690 q50,12 100,0 t100,0"/>
  </g>
</svg>
